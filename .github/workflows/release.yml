name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write
  packages: write
  security-events: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Compute lowercase image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/adguard-sync-mdw" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `latest` is applied on version tags only (metadata-action `latest=auto`),
      # so it always points at the most recent release, never at unreleased main.
      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{raw}}
            type=sha,prefix=sha-,format=short

      - name: Build image for scan
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.IMAGE }}:scan-${{ github.sha }}

      # Reporting scan: records everything, including CVEs with no vendor patch, so
      # they stay visible in code scanning. security.yml only scans the filesystem,
      # so this is the only thing that sees base-image OS packages. Never fails the
      # build — the gate below decides that.
      - name: Trivy scan (report)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE }}:scan-${{ github.sha }}
          format: sarif
          output: trivy-image.sarif
          severity: CRITICAL,HIGH
          exit-code: '0'

      - name: Upload Trivy results
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-image.sarif
          category: container

      # Release gate: blocks only on CRITICALs we can actually act on. `ignore-unfixed`
      # stops unpatchable base-image CVEs (e.g. the perl-base CRITICALs in
      # python:3.14-slim, which have no fixed version) from holding every security
      # release hostage. Those findings are not lost — the reporting scan above
      # already uploaded them to code scanning.
      - name: Trivy gate — fixable CRITICALs
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE }}:scan-${{ github.sha }}
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          body_path: CHANGELOG.md
