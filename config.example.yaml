interval_minutes: 5
dry_run: true
database_path: /data/adguard-sync.db
history_retention_days: 14
# Safety guard: if a run would prune more than this % of a follower's block lists,
# allowlists or rewrites, those removals are skipped and the run is marked partial.
# Protects against a primary returning an empty list. 100 disables the guard.
max_prune_percent: 50
log_level: INFO

# This file can be edited from the dashboard Settings page when it is mounted
# writable at /config/config.yaml. Keep real secret values in .env and reference
# them here as ${ENV_VAR} placeholders.

# The dashboard serves HTTPS by default. With no cert provided, a self-signed
# certificate is generated under the data directory (/data/certs). To use your
# own certificate, mount the PEM files and point cert_file/key_file at them.
# Set enabled: false only when TLS is terminated by a reverse proxy in front.
tls:
  enabled: true
  # cert_file: /config/certs/server.crt
  # key_file: /config/certs/server.key

primary:
  name: primary
  url: https://adguard-primary.example.local
  username: admin
  password: ${ADGUARD_PRIMARY_PASSWORD}
  verify_ssl: true

followers:
  - name: follower-a
    url: https://adguard-follower-a.example.local
    username: admin
    password: ${ADGUARD_FOLLOWER_A_PASSWORD}
    verify_ssl: true

scope:
  blocklists:
    enabled: true
    prune: true
  allowlists:
    enabled: true
    prune: true
  user_rules:
    enabled: true
    prune: false
  rewrites:
    enabled: true
    prune: true
  upstream_dns:
    enabled: true
    prune: false
  blocked_services:
    enabled: true
    prune: false
  # Opt-in. Rate limit, DNSSEC and cache settings (prune has no effect).
  dns_settings:
    enabled: false
    prune: false
  # Opt-in. Query log on/off, retention, client IP anonymisation, ignored domains.
  querylog:
    enabled: false
    prune: false

# Optional alerts on state changes (host down/up, sync partial/failed/recovered).
# The webhook URL often contains a secret token: keep it in .env, not here.
# format: json (generic; also works with Slack/Discord) or ntfy (plain text + headers).
# notifications:
#   webhook_url: ${ALERT_WEBHOOK_URL}
#   format: json
